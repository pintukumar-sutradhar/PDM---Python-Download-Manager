[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-download-manager"
version = "1.1"
description = "PDM Download Manager — a professional, IDM-style download manager with a queued multi-threaded engine, media format picker and browser-based authentication."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pintu Kumar Sutradhar" }]
keywords = ["download-manager", "downloader", "pyside6", "yt-dlp", "hls", "media"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "yt-dlp>=2024.3.15",
    "m3u8>=6.0",
    "beautifulsoup4>=4.12",
    "ffmpeg-python>=0.2.0",
    "static-ffmpeg>=2.5",
    "urllib3>=2.0",
]

[project.urls]
Homepage = "https://github.com/pintukumar-sutradhar/PDM---Python-Download-Manager"
Repository = "https://github.com/pintukumar-sutradhar/PDM---Python-Download-Manager"
Issues = "https://github.com/pintukumar-sutradhar/PDM---Python-Download-Manager/issues"

[project.gui-scripts]
pdm-manager = "pdm:main"

[tool.setuptools]
py-modules = ["pdm"]
packages = { find = { include = ["core*", "ui*", "download*"] } }
